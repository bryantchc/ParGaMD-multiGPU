# ---------------------------------------------------------------------------
# 03 -- 2D rectilinear grid with NON-UNIFORM per-bin walker counts
#
# This is a drop-in alternate for Ultra_RL2.rna.preloop3: same 15 x 17 grid on
# (PI/WED docking, REC1 clearance), but walkers are allocated by region instead
# of evenly. Swap it in with the run STOPPED; WESTPA reads west.cfg when the
# sim manager starts and resumes from the last completed iteration.
#
# WHY. Measured over 1630 parent/child pairs of this system at tau = 200 ps:
#
#     coordinate            mean advance per child per tau
#     clearance (open up)   -0.193 A  (sd 0.817)   <- fights a restoring force
#     dock (seat deeper)    -0.004 A  (sd 0.274)   <- essentially diffusive
#
# REC1 *wants to shut*. Progress along clearance comes only from the upper tail
# of that distribution, so a frontier bin needs enough walkers for the tail to
# clear zero at all. P(every child of a bin retreats in one tau) is 32% at 2
# walkers/bin but 3.4% at 6 -- compounded over 10 iterations, the chance a hard-
# won open bin still exists is 2% versus 71%. Meanwhile the closed bulk held
# thousands of walkers against tens in the corner, so it can afford 2.
#
# WHAT THIS DOES AND DOES NOT BUY. It is walker-NEUTRAL: 1028 at full occupancy
# versus 1020 for uniform 4. It does not make iterations faster or cheaper. It
# redistributes ~100 walkers out of the oversampled closed bulk and the
# dissociation overflow and into the corner. The payoff is bin SURVIVAL, not
# throughput. If you want throughput, cut the corner to 4 and the bulk to 2 --
# and give up the survival gain.
#
# REGENERATE, DO NOT HAND-EDIT. The list below is 255 entries in C order
# (index = dock_bin * 17 + clearance_bin) and is invalidated by ANY boundary
# change. It is generated from a policy function:
#
#     python westpa_scripts/make_target_counts.py \
#         --west-cfg west.cfg --policy corner-weighted --emit yaml --assert-order
#
# --assert-order re-verifies the C-order assumption against WESTPA's own
# RectilinearBinMapper before emitting; it checked 255/255 cells for this grid.
#
# SAFE ONLY FOR THIS SHAPE OF RUN. A non-uniform list is well defined for a
# STATIC mapper with no target states. It is NOT safe with MAB or adaptive
# Voronoi (boundaries move, so a flat index means a different region each
# iteration), not with RecursiveBinMapper (different flattening), and not with
# target states -- see 04-mab-adaptive.cfg and the README for the two places in
# WESTPA that assume uniformity.
# ---------------------------------------------------------------------------
# WEST configuration -- Ultra_RL2.rna.preloop3
#
# Tests the clamp hypothesis: the REC lobes breathe, a transient OPEN state lets
# the PAM duplex seat against PI/WED without clashing, and REC then closes to
# stabilise recognition.
#
# EVIDENCE THIS IS THE BLOCK. Putting each reference's DNA into the simulation
# frame (aligned on the WED+PI core) and asking whether the simulation's REC1
# occupies that DNA's space:
#
#     reference DNA        sim REC1 min dist   pairs <3 A   its own REC1
#     9CJH  (0 bp, 31 nt)        2.12 A               1     4.73 A,    0
#     8SFH  (5 bp, 32 nt)        0.37 A           1,084     2.86 A,    2
#     8SFO  (20 bp, 56 nt)       0.10 A           3,806     2.60 A,   13
#
# The references keep REC1 clear of their own DNA; this system does not, and the
# overlap grows with DNA length. REC1 is displaced 9.8 A as a RIGID BODY
# (internal shape RMSD only 2.29 A) -- intact, just in the wrong place.
#
# Progress coordinate (7 dims; dims 0 and 1 are binned):
#   0  cv_0_pam_dock         PI/WED-face PAM contacts        A    [BINNED, down]
#   1  cv_1_rec1_clearance   REC1 <-> PAM duplex room        A    [BINNED, up]
#   2  cv_2_rec1_projection  REC1 along the opening axis     A    [recorded]
#   3  cv_3_site_fit         PAM-site CA fit to 9CJH         A    [recorded]
#   4  cv_4_pam_readout      base-specific TTTV readout      A    [recorded]
#   5  cv_5_dna_bend         bend across the PAM             deg  [recorded]
#   6  cv_6_bp_opening       WC opening of bp+1/bp+2         A    [recorded]
---
west:
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 7
      pcoord_len: 100
      pcoord_dtype: !!python/name:numpy.float32

      # 2D binning on (docking, clearance).
      #
      # WHY 2D AND NOT A 1D PUSH ON EITHER. A clamp mechanism is
      # open -> DNA enters -> close. Driving clearance alone parks the system
      # open with the duplex unseated; driving docking alone is what stalled the
      # last two runs. Binning both lets WE hold the diagonal: clearance rises,
      # the DNA seats, clearance falls with the contacts now formed. It also
      # makes the hypothesis falsifiable -- if walkers reach 8-10 A of clearance
      # and docking still does not improve, REC1 is not the obstruction.
      #
      # WHY THE DOCKING COORDINATE IS ONE-SIDED. cv_0 uses only PI/WED-face
      # contacts. Sidedness was measured, not assumed: each contact residue's CA
      # was projected in 9CJH onto the PAM-duplex -> REC1 axis, and the REC-facing
      # ones (542, 782, 784) dropped, plus 780 as bridge-helix/RuvC. Otherwise
      # driving docking would implicitly drive breathing and the two binned
      # dimensions would not be separable.
      #
      # CALIBRATION, both measured over 126-211 walkers at tau = 200 ps:
      #   cv_0 docking    median |step| ~0.24 A  -> 0.25 A bins ~ 1 bin/tau
      #   cv_1 clearance  median |step|  0.31 A  -> 0.40 A bins ~ 0.8 bin/tau
      # Clearance is deliberately a little coarse: 2D multiplies, and this grid
      # is already 15 x 17 = 255 cells.
      #
      # WHY NOT MAB. Its failure mode two runs ago was an unbounded WRONG
      # direction inflating the grid. For clearance the wrong direction (closing)
      # is sterically bounded near 3.3 A, so that argument does not apply -- but
      # cv_0's wrong direction (the DNA leaving) IS unbounded, and MAB applies one
      # adaptive scheme across the whole mapper. A fixed grid with 'inf' overflow
      # bins on both axes is controllable and the ranges are already known.
      #
      # Landmarks on cv_1: 3.3 A current ensemble | 7.02 A at 9CJH | headroom
      # above, because the clamp model needs states MORE open than any deposited
      # structure. 9CJH is a landmark, never a target.
      bins:
        type: RectilinearBinMapper
        boundaries:
          - [0, 3.75, 4.0, 4.25, 4.5, 4.75, 5.0, 5.25, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0, 9.0, 'inf']
          - [0, 3.0, 3.4, 3.8, 4.2, 4.6, 5.0, 5.4, 5.8, 6.2, 6.6, 7.0, 7.5, 8.0, 8.5, 9.0, 10.0, 'inf']
          - ['-inf', 'inf']
          - ['-inf', 'inf']
          - ['-inf', 'inf']
          - ['-inf', 'inf']
          - ['-inf', 'inf']

      # 15 x 17 = 255 cells. The seeded set occupies 100 of them, so expect
      # ~400-480 walkers/iteration -- about half the original run's ~1000.
      #
      # WHY THE DOCKING AXIS RUNS OUT TO 9 A. Measured over 9116 walkers of
      # Ultra_RL2.rna (iterations 95-123): clearance >= 7.0 A occurs ONLY at
      # dock > 6.5 A. Exactly 6 walkers have both dock <= 6.5 and clearance
      # >= 6.6. Opening REC1 currently costs ~2 A of docking, so if the dock
      # axis stopped at 6.5 the entire open region would collapse into one
      # overflow bin and WE could not see a walker there improving its contacts
      # -- the single most important thing this run needs to reward. Past 9 A
      # the duplex is leaving the cleft; that is one overflow bin on purpose,
      # so walkers are caught but dissociation is not rewarded with a ladder.
      # generated by westpa_scripts/make_target_counts.py --policy corner-weighted
      # grid 15 x 17 x 1 x 1 x 1 x 1 x 1 = 255 bins; regenerate after ANY boundary change.
