# ---------------------------------------------------------------------------
# 01 -- 1D rectilinear grid  (the simplest useful WE setup)
#
# One progress coordinate, fixed bins. Start here unless you have a specific
# reason not to: it is the only scheme where you can look at the bin
# occupancies and immediately understand what WE is doing.
#
# pcoord_ndim must equal the number of `boundaries:` lists AND the number of
# cv_*.py files the dispatcher finds. A mismatch fails at iteration 1 with an
# index error out of digitize, which is not an obvious symptom -- check this
# first when a fresh run dies immediately.
#
# THE OVERFLOW BINS MATTER. The 'inf' at the top is not decoration. Without it
# any walker beyond the last edge is unassignable and the run dies. With it,
# such walkers are caught in a single bin -- which also means everything past
# that edge is invisible to WE, so put the edge where you still want
# resolution, not where you think sampling ends.
#
# A COMMON FAILURE: if most sampling lands in the overflow bin, your grid does
# not bracket the system. Measure the CV on real frames BEFORE choosing edges.
# ---------------------------------------------------------------------------
---
west:
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      # One CV -> one boundaries list.
      pcoord_ndim: 1
      # Frames recorded per segment. >= 2 so analysis tools see parent + last.
      pcoord_len: 100
      pcoord_dtype: !!python/name:numpy.float32
      bins:
        type: RectilinearBinMapper
        # 0.25 A spacing out to 10 A, then everything else. Spacing should be
        # ~1 median |step| per tau -- measure it, do not guess.
        boundaries:
          - [0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75,
             3.0, 3.25, 3.5, 3.75, 4.0, 4.5, 5.0, 5.5, 6.0, 7.0, 8.0, 10.0, 'inf']
      # Walkers per OCCUPIED bin. Total cost is this times occupied bins, which
      # grows as the run explores -- it is not a fixed budget.
      bin_target_counts: 4
  propagation:
    max_total_iterations: 250
    max_run_wallclock:    47:30:00
    propagator:           executable
    # true makes WESTPA build initial states from basis states itself. false
    # when you supply prepared states (e.g. via make_bstates.py).
    gen_istates:          false
  data:
    west_data_file: west.h5
    datasets:
      - name:        pcoord
        dtype:       float32
        # Lossy compression: keeps ~4 decimal digits. Fine for a pcoord in
        # Angstroms, NOT fine if your CV is a small dimensionless number.
        scaleoffset: 4
