# ---------------------------------------------------------------------------
# 04 -- MAB (Minimal Adaptive Binning): bins that follow the ensemble
#
# MAB re-places bins every iteration along the populated region of each
# dimension, plus extra bins at the leading edge, the trailing edge and the
# bottleneck. You do not choose edges; you choose how many bins and which
# direction counts as progress.
#
# WHEN IT WINS. When you genuinely do not know the range your CV will occupy.
# A rectilinear grid chosen badly dumps everything into one overflow bin and
# WE goes blind; MAB cannot make that mistake because it follows the walkers.
#
# THE FAILURE MODE THAT COST THIS PROJECT A RUN. MAB spans ensemble min..max
# along each dimension. If the WRONG direction is UNBOUNDED, the span inflates
# every iteration, bins stretch to cover territory nobody cares about, and
# walkers drain into the tail. A contact-distance CV has exactly this shape:
# "formed" is bounded near 3 A, but "unformed" runs to infinity as the ligand
# leaves. The run kept discovering new ways to be far away.
#
# So before choosing MAB, ask whether the wrong direction is bounded. If the
# coordinate is an RMSD or a contact distance and dissociation is possible, it
# is not, and a rectilinear grid with a deliberate overflow bin is safer --
# there the damage is capped at one bin instead of rescaling the whole mapper.
#
# DIRECTION is per dimension:
#     0   explore both ways (default)
#    -1   drive toward SMALLER values
#     1   drive toward LARGER values
# Getting the sign wrong is silent -- WE will efficiently drive the system the
# wrong way and everything will look healthy.
#
# DO NOT COMBINE WITH NON-UNIFORM bin_target_counts. A hand-supplied list is
# indexed by absolute bin number, but under MAB bin i denotes a DIFFERENT
# region of phase space each iteration, so the list silently mis-targets.
# WESTPA's own adaptive Voronoi driver rewrites system.bin_target_counts every
# iteration rather than trusting a static list, for exactly this reason.
# ---------------------------------------------------------------------------
---
west:
  system:
    driver: westpa.core.systems.WESTSystem
    system_options:
      pcoord_ndim: 2
      pcoord_len: 100
      pcoord_dtype: !!python/name:numpy.float32
      bins:
        type: MABBinMapper
        # Bins per dimension. MAB adds edge/bottleneck bins on top of these,
        # so the real bin count is somewhat higher than the product.
        nbins: [15, 15]
        # Progress direction per dimension. See the warning above.
        direction: [-1, 1]
        # Skip a dimension entirely (1 = do not adapt along it).
        skip: [0, 0]
        # Place an extra bin at the detected bottleneck -- usually worth it,
        # since the bottleneck is where the barrier is.
        bottleneck: true
        pca: false
      # Scalar only. See the warning above about non-uniform lists under MAB.
      bin_target_counts: 5
  propagation:
    max_total_iterations: 250
    max_run_wallclock:    47:30:00
    propagator:           executable
    gen_istates:          false
  data:
    west_data_file: west.h5
    datasets:
      - name:        pcoord
        dtype:       float32
        scaleoffset: 4
